[project]
name = "matrix-bot-tools"
version = "0.1.0"
description = "Matrix-Tools für Hochschulgruppen: Watchdog, Broadcast, Raum-Erstellung und Mitglieder-Sync."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "markdown>=3.10.3",
    "matrix-nio>=0.26.0",
    "requests>=2.34.2",
]

[project.scripts]
matrix-tools = "matrix_tools.cli:main"

[project.urls]
Repository = "https://github.com/Fachschaft-Media/matrix-bot-tools"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "matrix_tools"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
    "types-markdown>=3.10.2.20260712",
    "types-requests>=2.33.0.20260906",
]
